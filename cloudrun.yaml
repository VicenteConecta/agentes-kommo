apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: kommo-agents
spec:
  template:
    spec:
      containers:
      - image: gcr.io/agentes-kommo-beauty-market/kommo-agents:latest
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
